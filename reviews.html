        <main>
            <h1>Leave Your Feedback</h1>
            <p>Have you used TrixOS? Share your experience with the community!</p>

            <!-- Форма для отправки на почту (для анонимных отзывов) -->
            <form action="https://formsubmit.co/sxhew78@gmail.com" method="POST">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" required>

                <label for="review">Your Review</label>
                <textarea id="review" name="review" rows="5" required></textarea>

                <label for="rating">Rating (1–5 stars)</label>
                <input type="number" id="rating" name="rating" min="1" max="5" required>

                <button type="submit" class="btn">Submit Review</button>
            </form>

            <hr style="margin: 40px 0; border: none; border-top: 2px solid #eee;">

            <h2>💬 Discussion &amp; Reviews</h2>
            <p>Join the conversation below. Share your thoughts, ask questions, and help others!</p>
